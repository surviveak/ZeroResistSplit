name: Rebuild README images as high-res JPEGs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-readme-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Re-encode README images at high resolution
        run: |
          set -e
          for f in             assets/ZeroResistSplit_v2.7_top_real_world_dimensions.jpg             assets/ZeroResistSplit_v2.7_side_real_world_dimensions.jpg             assets/zeroresistsplit-prototype-revisions.jpg
          do
            tmp="${f%.jpg}.highres.jpg"
            convert "$f"               -filter Lanczos               -resize 1448x1086               -background white -gravity center -extent 1448x1086               -unsharp 0x0.65+0.65+0.008               -sampling-factor 4:4:4               -quality 92               -strip               "$tmp"
            mv "$tmp" "$f"
          done

      - name: Commit rebuilt images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ZeroResistSplit_v2.7_top_real_world_dimensions.jpg                   assets/ZeroResistSplit_v2.7_side_real_world_dimensions.jpg                   assets/zeroresistsplit-prototype-revisions.jpg
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Rebuild README images as high-res JPEGs [skip ci]"
            git push
          fi
