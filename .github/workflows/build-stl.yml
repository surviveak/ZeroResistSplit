name: Build final STL models

on:
  push:
    branches: [main]
    paths:
      - "source/PTFE_Splitter_A_v2.7.scad"
      - ".github/workflows/build-stl.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-stl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Generate v2.7 STL halves
        run: |
          mkdir -p models
          openscad -D 'halfpart=1' -o models/PTFE_Splitter_A_v2.7_Half1.stl source/PTFE_Splitter_A_v2.7.scad
          openscad -D 'halfpart=2' -o models/PTFE_Splitter_A_v2.7_Half2.stl source/PTFE_Splitter_A_v2.7.scad

      - name: Commit generated STL files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/PTFE_Splitter_A_v2.7_Half1.stl models/PTFE_Splitter_A_v2.7_Half2.stl
          if git diff --cached --quiet; then
            echo "STL files are already current."
          else
            git commit -m "Build v2.7 STL files [skip ci]"
            git push
          fi
